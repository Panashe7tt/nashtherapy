<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Nash Therapy</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <img src="images/logo.png" alt="Nash Therapy" class="logo-img">
      </a>
      <div class="nav-actions">
        <button id="theme-toggle" class="theme-btn" aria-label="Toggle dark mode">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card animate-fade-up">
      <div class="auth-tabs">
        <a href="login.html" class="auth-tab">Log In</a>
        <a href="signup.html" class="auth-tab active">Sign Up</a>
      </div>
      <h1 class="auth-title">Create your account</h1>
      <p class="auth-subtitle">You're taking an important step. Your information stays private.</p>
      <form class="auth-form" id="signup-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="e.g. Zinhle Dlamini" required autocomplete="name">
        </div>
        <div class="form-group">
          <label for="email">Student Email</label>
          <input type="email" id="email" name="email" placeholder="student@university.edu" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Create a secure password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-full">Create Account</button>
      </form>
      <p class="auth-footer">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </main>
  <script src="script.js"></script>
  <script>
    document.getElementById("signup-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var nameInput = document.getElementById("name");
      var emailInput = document.getElementById("email");
      var name = (nameInput.value || "").trim();
      var email = (emailInput.value || "").trim();

      if (!name) {
        alert("Please enter your name.");
        nameInput.focus();
        return;
      }

      var password = document.getElementById("password").value;
      var key = NashAuth.clean(email);
      var users = NashAuth.users();
      if (users[key]) {
        alert("An account with this email already exists. Please log in.");
        return;
      }

      // Save this user's account, then log them in
      users[key] = { name: name, email: email, password: password };
      NashAuth.saveUsers(users);
      NashAuth.login(key);

      // Redirect
      window.location.href = "dashboard.html";
    });
  </script>
</body>
</html>
